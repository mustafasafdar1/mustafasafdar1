name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          github_user_name: mustafasafdar1
          outputs: |
            output/snake.svg
            output/snake-dark.svg?palette=github-dark
      
      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          mkdir -p output
          git add output/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update snake animation"
          git push
